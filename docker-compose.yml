version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: motion_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: motion_store
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion_dev_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion -d motion_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
